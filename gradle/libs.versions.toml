# Dependency versions for the whole project. Every library and plugin version lives here; nothing
# in the build scripts carries a version of its own, so this file is the single place to bump one.
[versions]
# Newest versions that still declare minSdk 19. AndroidX raised its floor to 21 in 2024, so bumping
# these requires raising minSdk in app/build.gradle.kts first.
activity = "1.9.3"
android-gradle-plugin = "9.4.1"
appcompat = "1.6.1"
core = "1.13.1"
# The bundled debug keystore is BKS, which the JVM only understands with BouncyCastle registered.
# Android ships that provider, so this is only needed by the tests.
bouncycastle = "1.86"
# MorpheApp fork of REAndroid/ARSCLib, pinned to a commit because the project has no releases.
# It carries the archive-writer and resource-table fixes the merger depends on. Switch back to
# com.github.REAndroid:ARSCLib once those land upstream.
arsclib = "9b742c412d"
# ARSCLib is a plain Java library compiled against java.util.function, which Android only gained in
# API 24. The minimal desugaring spec is the smallest one covering it, which matters here because
# the app ships without R8.
desugar-jdk-libs = "2.1.5"
junit = "4.13.2"
material = "1.12.0"
robolectric = "4.17"
test-core = "1.6.1"

[libraries]
activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
arsclib = { module = "com.github.MorpheApp:ARSCLib", version.ref = "arsclib" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs_minimal", version.ref = "desugar-jdk-libs" }
junit = { module = "junit:junit", version.ref = "junit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-core = { module = "androidx.test:core", version.ref = "test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }